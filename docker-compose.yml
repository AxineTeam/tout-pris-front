# Développement : front Vite + API Django + Mailpit, où atterrissent les
# emails de l'API.
# Front sur http://localhost:5173, /api proxyfié vers le service api,
# emails lisibles sur http://localhost:8025.
services:
  front:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    image: estb/tout-pris-back:dev
    environment:
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    ports:
      - '8000:8000'
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
