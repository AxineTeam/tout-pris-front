# Développement : front Vite + backend Django (image dev de tout-pris-back).
# Front sur http://localhost:5173, /api proxyfié vers l'api.
services:
  front:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

  api:
    image: estb/tout-pris-back:dev
    ports:
      - '8000:8000'
