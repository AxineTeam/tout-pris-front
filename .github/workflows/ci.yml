name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    services:
      # Les emails de l'API (vérification d'adresse, réinitialisation) partent
      # vers Mailpit, dont l'API HTTP est lue par les E2E pour suivre les liens.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      # E2E contre la vraie image de l'API, comme un service Woodpecker :
      # tag dev sur branche/PR, tag x.y.z quand la CI tourne sur le tag x.y.z.
      api:
        image: estb/tout-pris-api:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        env:
          EMAIL_HOST: mailpit
          EMAIL_PORT: 1025
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npx eslint .

      - run: npx prettier --check .

      - run: npm run test:unit -- --run

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Depuis l'environnement du workflow, jamais depuis le dépôt : .git ne va
      # pas dans le contexte de build. Même convention que l'API — le ref, qui
      # est le tag sur une release et la branche sinon, et le commit court.
      - name: Version the image answers with
        id: build
        run: echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ steps.build.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-docker:
    name: Build & Push Docker image
    needs: [check-and-test, build-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tout-pris-front
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # Merge sur main -> tag dev ; tag x.y.z -> même tag que l'image de l'API.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      # Depuis l'environnement du workflow, jamais depuis le dépôt : .git ne va
      # pas dans le contexte de build. Même convention que l'API — le ref, qui
      # est le tag sur une release et la branche sinon, et le commit court.
      - name: Version the image answers with
        id: build
        run: echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ steps.build.outputs.commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
